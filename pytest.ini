[pytest]
# Limit collection to the canonical tests/ directory. The legacy
# `chatbot/setup_main_store/` and `chatbot/tests/` folders contain
# adhoc scripts that pull in google-genai / cohere / etc. and will
# happily error during collection in any environment that doesn't
# have the full RAG stack installed.
testpaths = tests
norecursedirs = chatbot frontend node_modules .venv venv build dist
